<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>emo larp</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
  
  <link rel="preload" as="image" href="avatar.png" />
</head>
<body>

  <!-- Entry Overlay -->
  <div id="entry-overlay" onclick="enterSite()">
    <div class="entry-content">
      <p class="glitch-enter">[ click to enter ]</p>
    </div>
  </div>

  <!-- Audio Volume / Mute Button -->
  <button id="sound-toggle" onclick="toggleAudioMute()" title="Mute/Unmute audio">
    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
  </button>

  <!-- Notification Toast for Copied Info -->
  <div id="toast" class="toast">[ copied to clipboard ]</div>

  <!-- Background Video -->
  <div class="video-bg-container">
    <video id="bg-video" loop playsinline>
      <source src="clip.mp4" type="video/mp4" />
    </video>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
  </div>

  <!-- Draggable Profile Frame -->
  <main class="profile-frame" id="draggable-card">
    <div class="corner-bracket top-left"></div>
    <div class="corner-bracket top-right"></div>
    <div class="corner-bracket bottom-left"></div>
    <div class="corner-bracket bottom-right"></div>

    <!-- Drag Handle Indicator (Double click resets center) -->
    <div class="drag-bar" id="drag-handle" title="Hold to drag / Double click to center">
      <span>:::</span>
    </div>

    <!-- Random Typewriter Message Cycle -->
    <div class="typewriter-box">
      <span id="typewriter-text"></span><span class="cursor">|</span>
    </div>

    <!-- Avatar Box -->
    <div class="avatar-box">
      <div class="avatar-hex">
        <img id="avatar-img" src="avatar.png" draggable="false" onerror="fetchInstantDiscordAvatar()" alt="avatar" />
        <span id="status-dot" class="status-offline"></span>
      </div>
      <div class="user-details">
        <h1 class="username">emo larp</h1>
        <p class="status-tracker" id="activity-tracker">fetching status...</p>
      </div>
    </div>

    <!-- Symmetrical Badges -->
    <div class="social-badges">
      <button onclick="copyDiscordId()" class="badge-link discord" title="Copy Discord ID">
        <i class="fa-brands fa-discord"></i>
      </button>
      <a href="https://steamcommunity.com/id/ussf/" target="_blank" rel="noopener noreferrer" class="badge-link steam" title="Steam">
        <i class="fa-brands fa-steam"></i>
      </a>
      <a href="https://www.roblox.com/users/1871164209/profile" target="_blank" rel="noopener noreferrer" class="badge-link roblox" title="Roblox">
        <i class="fa-solid fa-cube"></i>
      </a>
      <a href="https://open.spotify.com/user/31u5ifxsp3j6dg773hocztyiirfq?si=e51e78c289c84457" target="_blank" rel="noopener noreferrer" class="badge-link spotify" title="Spotify">
        <i class="fa-brands fa-spotify"></i>
      </a>
    </div>
  </main>

  <script>
    const STEAM_CUSTOM_URL = "ussf";
    const DISCORD_USER_ID = "1416390397881749514";

    const overlay = document.getElementById('entry-overlay');
    const video = document.getElementById('bg-video');
    const soundIcon = document.getElementById('sound-icon');
    const toast = document.getElementById('toast');

    function enterSite() {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.style.display = 'none', 600);
      
      video.muted = false;
      video.play().catch(() => {
        video.muted = true;
        video.play();
        soundIcon.className = "fa-solid fa-volume-xmark";
      });
    }

    function toggleAudioMute() {
      video.muted = !video.muted;
      soundIcon.className = video.muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
    }

    function showToast(text) {
      toast.innerText = text;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2200);
    }

    function copyDiscordId() {
      navigator.clipboard.writeText(DISCORD_USER_ID).then(() => {
        showToast("[ discord id copied ]");
      }).catch(() => {
        window.open(`https://discord.com/users/${DISCORD_USER_ID}`, '_blank');
      });
    }

    /* Fast Discord Avatar Fallback */
    async function fetchInstantDiscordAvatar() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const data = await res.json();
        if (data.data?.discord_user?.avatar) {
          document.getElementById('avatar-img').src = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${data.data.discord_user.avatar}.png?size=256`;
        }
      } catch (e) {
        document.getElementById('avatar-img').src = "https://api.dicebear.com/7.x/bottts/svg?seed=emolarp";
      }
    }

    /* Random Obsession Phrases Pool */
    const phrases = [
      "i love you so much it hurts...",
      "don't look away from me <3",
      "staring right through your screen.",
      "thinking about you endlessly...",
      "you can't leave this page now.",
      "every second without you is empty.",
      "i know you're still watching.",
      "carved your name into my mind.",
      "you're the only thing that matters :3",
      "let me stay in your head forever.",
      "obsessed is an understatement.",
      "don't close this tab..."
    ];

    let currentPhrase = "";
    let charIndex = 0;
    let isDeleting = false;
    let lastIndex = -1;
    const typeSpeed = 85;
    const eraseSpeed = 40;
    const holdDelay = 1900;
    const typewriterEl = document.getElementById('typewriter-text');

    function getRandomPhrase() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * phrases.length);
      } while (nextIndex === lastIndex && phrases.length > 1);
      lastIndex = nextIndex;
      return phrases[nextIndex];
    }

    function typeLoop() {
      if (!currentPhrase) {
        currentPhrase = getRandomPhrase();
      }

      if (!isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;

        if (charIndex === currentPhrase.length) {
          isDeleting = true;
          setTimeout(typeLoop, holdDelay);
          return;
        }
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;

        if (charIndex === 0) {
          isDeleting = false;
          currentPhrase = getRandomPhrase();
        }
      }

      setTimeout(typeLoop, isDeleting ? eraseSpeed : typeSpeed);
    }

    typeLoop();

    /* Steam with Immediate Discord Fallback */
    async function loadPresence() {
      const tracker = document.getElementById('activity-tracker');
      const dot = document.getElementById('status-dot');
      const avatarImg = document.getElementById('avatar-img');

      fetchInstantDiscordAvatar();

      try {
        const steamTarget = `https://steamcommunity.com/id/${STEAM_CUSTOM_URL}/?xml=1`;
        const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(steamTarget)}`;
        const res = await fetch(proxyUrl);
        
        if (res.ok) {
          const xmlText = await res.text();
          if (xmlText && xmlText.includes("<profile>")) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");

            const avatarFull = xmlDoc.querySelector("avatarFull")?.textContent;
            if (avatarFull) avatarImg.src = avatarFull;

            const onlineState = xmlDoc.querySelector("onlineState")?.textContent;
            const gameName = xmlDoc.querySelector("gameName")?.textContent;
            const stateMessage = xmlDoc.querySelector("stateMessage")?.textContent;

            if (onlineState === "in-game" && gameName) {
              dot.className = "status-ingame";
              tracker.innerText = `playing ${gameName}`;
              return;
            } else if (onlineState === "online") {
              dot.className = "status-online";
              tracker.innerText = "online on steam";
              return;
            } else if (stateMessage) {
              dot.className = "status-offline";
              tracker.innerText = stateMessage.replace(/<[^>]*>/g, '').trim().toLowerCase();
              return;
            }
          }
        }
      } catch (err) {}

      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const data = await res.json();
        if (data.success && data.data) {
          const lanyard = data.data;
          const game = lanyard.activities.find(a => a.type === 0);
          if (game) {
            dot.className = "status-ingame";
            tracker.innerText = `playing ${game.name}`;
          } else if (lanyard.discord_status !== 'offline') {
            dot.className = `status-${lanyard.discord_status}`;
