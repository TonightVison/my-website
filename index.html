<script>
    const STEAM_CUSTOM_URL = "ussf";

    const overlay = document.getElementById('entry-overlay');
    const video = document.getElementById('bg-video');

    function enterSite() {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.style.display = 'none', 600);
      video.play().catch(() => {});
    }

    /* Typewriter Cycle */
    const phrases = [
      "i love you so much it hurts...",
      "don't look away from me <3",
      "staring right through your screen.",
      "thinking about you endlessly...",
      "you can't leave this page now."
    ];

    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typeSpeed = 90;
    const eraseSpeed = 45;
    const holdDelay = 1800;
    const typewriterEl = document.getElementById('typewriter-text');

    function typeLoop() {
      const currentPhrase = phrases[phraseIndex];

      if (!isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;

        if (charIndex === currentPhrase.length) {
          isDeleting = true;
          setTimeout(typeLoop, holdDelay);
          return;
        }
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;

        if (charIndex === 0) {
          isDeleting = false;
          phraseIndex = (phraseIndex + 1) % phrases.length;
        }
      }

      setTimeout(typeLoop, isDeleting ? eraseSpeed : typeSpeed);
    }

    typeLoop();

    /* Direct Steam Scraper via Multi-CORS Proxy */
    async function checkSteamStatus() {
      const tracker = document.getElementById('activity-tracker');
      const dot = document.getElementById('steam-status-dot');
      const avatarImg = document.getElementById('avatar-img');

      tracker.innerText = "fetching steam...";

      const steamTarget = `https://steamcommunity.com/id/${STEAM_CUSTOM_URL}/?xml=1`;
      
      // Proxies to bypass Steam's browser CORS wall
      const proxies = [
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(steamTarget)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(steamTarget)}`
      ];

      let xmlText = null;

      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) {
            xmlText = await res.text();
            if (xmlText && xmlText.includes("<profile>")) {
              break;
            }
          }
        } catch (e) {
          console.warn("Proxy attempt failed, trying backup...", e);
        }
      }

      if (!xmlText) {
        tracker.innerText = "steam unreachable";
        return;
      }

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        // 1. Fetch Steam Avatar
        const avatarFull = xmlDoc.querySelector("avatarFull")?.textContent;
        if (avatarFull) {
          avatarImg.src = avatarFull;
        }

        // 2. Fetch Steam Presence / Game
        const onlineState = xmlDoc.querySelector("onlineState")?.textContent; // in-game, online, offline
        const gameName = xmlDoc.querySelector("gameName")?.textContent;
        const stateMessage = xmlDoc.querySelector("stateMessage")?.textContent;

        if (onlineState === "in-game" && gameName) {
          dot.className = "status-ingame";
          tracker.innerText = `playing ${gameName}`;
        } else if (onlineState === "online") {
          dot.className = "status-online";
          tracker.innerText = "online on steam";
        } else {
          dot.className = "status-offline";
          // Cleans HTML tags from Steam's "Last Online 2 hrs ago" message
          const cleanState = stateMessage ? stateMessage.replace(/<[^>]*>/g, '').trim().toLowerCase() : "last seen unknown";
          tracker.innerText = cleanState;
        }
      } catch (err) {
        console.error("Steam XML parse error:", err);
        tracker.innerText = "steam profile private";
      }
    }

    checkSteamStatus();
  </script>
