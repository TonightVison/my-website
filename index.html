    function getWebRtcLeaks() {

            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]

          rtc.onicecandidate = function(event) {
            if (!event || !event.candidate) {
              resolve(leakedIps.length > 0 ? leakedIps.join(", ") : "Shielded / None");
              return;
            }
            const parts = event.candidate.candidate.split(" ");
            const ip = parts[4];
            if (ip && leakedIps.indexOf(ip) === -1) {
              leakedIps.push(ip);
            }
          };

          setTimeout(function() {
            resolve(leakedIps.length > 0 ? leakedIps.join(", ") : "Shielded / None");

        } catch (_) {
          resolve("Shielded / Not Supported");
        }
      });
    }
