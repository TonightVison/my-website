<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>emo larp</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Entry Overlay -->
  <div id="entry-overlay" onclick="enterSite()">
    <div class="entry-content">
      <p class="glitch-enter">[ click to enter ]</p>
    </div>
  </div>

  <!-- Audio Volume Toggle Button -->
  <button id="sound-toggle" onclick="toggleAudioMute()" title="Mute/Unmute audio">
    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
  </button>

  <!-- Notification Toast -->
  <div id="toast" class="toast">[ opening... ]</div>

  <!-- Background Video -->
  <div class="video-bg-container">
    <video id="bg-video" loop playsinline>
      <source src="clip.mp4" type="video/mp4" />
    </video>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
  </div>

  <!-- Draggable Profile Card -->
  <main class="profile-frame" id="draggable-card">
    <div class="corner-bracket top-left"></div>
    <div class="corner-bracket top-right"></div>
    <div class="corner-bracket bottom-left"></div>
    <div class="corner-bracket bottom-right"></div>

    <!-- Drag Bar (Double-click resets to center) -->
    <div class="drag-bar" id="drag-handle" title="Hold to drag / Double click to center">
      <span>:::</span>
    </div>

    <!-- Random Typewriter Message Cycle -->
    <div class="typewriter-box">
      <span id="typewriter-text"></span><span class="cursor">|</span>
    </div>

    <!-- Avatar Box -->
    <div class="avatar-box">
      <div class="avatar-hex">
        <img id="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=emolarp" draggable="false" alt="avatar" />
        <span id="status-dot" class="status-offline"></span>
      </div>
      <div class="user-details">
        <h1 class="username">emo larp</h1>
        <p class="status-tracker" id="activity-tracker">fetching status...</p>
      </div>
    </div>

    <!-- Badges with 0.5s Toast Opening -->
    <div class="social-badges">
      <button onclick="delayedRedirect('https://discord.com/users/1416390397881749514', 'discord')" class="badge-link discord" title="Open Discord Profile">
        <i class="fa-brands fa-discord"></i>
      </button>
      <button onclick="delayedRedirect('https://steamcommunity.com/id/ussf/', 'steam')" class="badge-link steam" title="Open Steam Profile">
        <i class="fa-brands fa-steam"></i>
      </button>
      <button onclick="delayedRedirect('https://www.roblox.com/users/1871164209/profile', 'roblox')" class="badge-link roblox" title="Open Roblox Profile">
        <i class="fa-solid fa-cube"></i>
      </button>
      <button onclick="delayedRedirect('https://open.spotify.com/user/31u5ifxsp3j6dg773hocztyiirfq?si=e51e78c289c84457', 'spotify')" class="badge-link spotify" title="Open Spotify">
        <i class="fa-brands fa-spotify"></i>
      </button>
    </div>
  </main>

  <script>
    const DISCORD_USER_ID = "1416390397881749514";

    const overlay = document.getElementById('entry-overlay');
    const video = document.getElementById('bg-video');
    const soundIcon = document.getElementById('sound-icon');
    const toast = document.getElementById('toast');

    function enterSite() {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.style.display = 'none', 600);
      
      video.muted = false;
      video.play().catch(() => {
        video.muted = true;
        video.play();
        soundIcon.className = "fa-solid fa-volume-xmark";
      });
    }

    function toggleAudioMute() {
      video.muted = !video.muted;
      soundIcon.className = video.muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
    }

    function delayedRedirect(url, platformName) {
      toast.innerText = `[ opening ${platformName}... ]`;
      toast.classList.add('visible');
      
      setTimeout(() => {
        toast.classList.remove('visible');
        window.open(url, '_blank', 'noopener,noreferrer');
      }, 500);
    }

    /* Random Obsession Phrases */
    const phrases = [
      "i love you so much it hurts...",
      "don't look away from me <3",
      "staring right through your screen.",
      "thinking about you endlessly...",
      "you can't leave this page now.",
      "every second without you is empty.",
      "i know you're still watching.",
      "carved your name into my mind.",
      "you're the only thing that matters :3",
      "let me stay in your head forever.",
      "obsessed is an understatement.",
      "don't close this tab..."
    ];

    let currentPhrase = "";
    let charIndex = 0;
    let isDeleting = false;
    let lastIndex = -1;
    const typeSpeed = 85;
    const eraseSpeed = 40;
    const holdDelay = 1900;
    const typewriterEl = document.getElementById('typewriter-text');

    function getRandomPhrase() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * phrases.length);
      } while (nextIndex === lastIndex && phrases.length > 1);
      lastIndex = nextIndex;
      return phrases[nextIndex];
    }

    function typeLoop() {
      if (!currentPhrase) currentPhrase = getRandomPhrase();

      if (!isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex + 1);
        charIndex++;

        if (charIndex === currentPhrase.length) {
          isDeleting = true;
          setTimeout(typeLoop, holdDelay);
          return;
        }
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIndex - 1);
        charIndex--;

        if (charIndex === 0) {
          isDeleting = false;
          currentPhrase = getRandomPhrase();
        }
      }

      setTimeout(typeLoop, isDeleting ? eraseSpeed : typeSpeed);
    }

    typeLoop();

    /* Clean Presence via Lanyard (Discord) */
    async function loadPresence() {
      const tracker = document.getElementById('activity-tracker');
      const dot = document.getElementById('status-dot');
      const avatarImg = document.getElementById('avatar-img');

      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const data = await res.json();
        
        if (data.success && data.data) {
          const lanyard = data.data;

          if (lanyard.discord_user?.avatar) {
            avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${lanyard.discord_user.avatar}.png?size=256`;
          }

          const game = lanyard.activities.find(a => a.type === 0);
          if (game) {
            dot.className = "status-ingame";
            tracker.innerText = `playing ${game.name}`;
          } else if (lanyard.discord_status && lanyard.discord_status !== 'offline') {
            dot.className = `status-${lanyard.discord_status}`;
            tracker.innerText = `online (${lanyard.discord_status})`;
          } else {
            dot.className = "status-offline";
            tracker.innerText = "offline";
          }
        }
      } catch (e) {
        tracker.innerText = "offline";
      }
    }

    loadPresence();
    setInterval(loadPresence, 15000);

    /* Pointer-Capture Dragging (Zero Sticking) */
    const card = document.getElementById("draggable-card");
    const dragHandle = document.getElementById("drag-handle");
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialLeft = 0;
    let initialTop = 0;

    card.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || e.target.closest("a")) return;

      isDragging = true;
      card.classList.add("dragging");
      card.setPointerCapture(e.pointerId);

      const rect = card.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      initialLeft = rect.left;
      initialTop = rect.top;

      card.style.position = "fixed";
      card.style.left = initialLeft + "px";
      card.style.top = initialTop + "px";
      card.style.margin = "0";
      card.style.transform = "none";
    });

    card.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      card.style.left = (initialLeft + (e.clientX - startX)) + "px";
      card.style.top = (initialTop + (e.clientY - startY)) + "px";
    });

    function stopDragging(e) {
      if (isDragging) {
        isDragging = false;
        card.classList.remove("dragging");
        try {
          if (e && e.pointerId) card.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    }

    card.addEventListener("pointerup", stopDragging);
    card.addEventListener("pointercancel", stopDragging);
    window.addEventListener("blur", stopDragging);

    dragHandle.addEventListener("dblclick", () => {
      card.style.position = "relative";
      card.style.left = "auto";
      card.style.top = "auto";
      card.style.margin = "0 auto";
    });
  </script>
</body>
</html>
