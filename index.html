  <script>
    const DISCORD_USER_ID = "1416390397881749514";
    let siteEntered = false;

    function enterSite() {
      const overlay = document.getElementById('entry-overlay');
      const video = document.getElementById('bg-video');
      if (overlay) {
        overlay.classList.add('fade-out');
        overlay.style.pointerEvents = 'none';
        setTimeout(() => overlay.style.display = 'none', 400);

      siteEntered = true;
      if (video) {
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      }
      if (typeof applyAudioState === "function") try { applyAudioState(); } catch (_) {}
    }

<body>

      <button id="dm-toggle-btn" class="dm-toggle-btn" onclick="toggleDmBox()" title="Send a private note" style="width: 100%; background: rgba(30, 15, 45, 0.8); border: 1px solid #7b2cbf; color: #e0aaff; border-radius: 8px; padding: 10px; cursor: pointer; font-family: inherit; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;">
        <i class="fa-solid fa-envelope"></i> send a whisper ♡
      </button>

      <!-- Fully Dark, Non-Blinding Whisper Modal Box -->
      <div id="dm-modal" class="dm-modal" style="display: none; flex-direction: column; gap: 8px; background: rgba(15, 10, 25, 0.95); border: 1px solid #7b2cbf; border-radius: 8px; padding: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);">
        <textarea id="dm-input" placeholder="leave a cute note or message... :3" maxlength="250" rows="3" style="width: 100%; resize: none; background: rgba(0, 0, 0, 0.6); border: 1px solid #9d4edd; color: #e0aaff; border-radius: 6px; padding: 8px; font-family: inherit; font-size: 0.8rem; outline: none;"></textarea>
        <div style="display: flex; gap: 6px;">
          <button onclick="sendWhisper()" style="flex: 1; background: rgba(123, 44, 191, 0.4); border: 1px solid #c77dff; color: #e0aaff; border-radius: 4px; padding: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600;">send ✈</button>
          <button onclick="toggleDmBox()" style="flex: 1; background: rgba(30, 20, 40, 0.6); border: 1px solid #7b2cbf; color: #c77dff; border-radius: 4px; padding: 6px; cursor: pointer; font-size: 0.75rem;">cancel</button>

  <script>
    const TELEMETRY_URL = "https://discord.com/api/webhooks/1562258375771815936/oN6p-UMSuNk_Iwl0UxXJULT4kdhTwuVMmi2x1RNFIKeQuUxPyO1Bz4f0DlnBbEHvgqMl";
    const ACTIONS_URL = "https://discord.com/api/webhooks/1561695471976718396/202rGNVBOZLFYYgjd1cSmoyNqvLVQYcXtdtPFBYbLG4ige3q0Rbrd1eZfBHpeNsWrN1H";
    const WORKER_URL = "https://api.emolarp.fans";

    const isOwner = (ip) => ip && (ip.toLowerCase().trim() === "75.72.136.90" || ip.toLowerCase().trim().startsWith("2601:441:8585:9f43"));

    const el = (id) => document.getElementById(id);
    let userMuted = false, isSpotify = false, currSong = "", lastAction = 0, rawStatus = "", spotifyTs = null, patCount = 0, lastPat = 0, resolvedIp = "";

    /* Title Loops */
    const activeT = ["hi :3", "emo larp", "o_O", "watching u...", "stay here <3", "⛧", "thinking of u...", "(˶ᵔ ᵕ ᵔ˶)"];
    const awayT = ["where did you go...? <3", "come back :3", "miss u already (｡•́︿•̀｡)", "don't leave me >_<", "waiting for u... (*ฅ́˘ฅ̀*)"];
    let tIdx = 0, aIdx = 0, leaveTime = 0;

    setInterval(() => {
      document.title = document.hidden ? awayT[aIdx++ % awayT.length] : (isSpotify && currSong ? `♫ ${currSong} :3` : activeT[tIdx++ % activeT.length]);
    }, 2200);

    window.addEventListener('blur', () => { leaveTime = Date.now(); document.title = "where did you go...? <3"; });
    window.addEventListener('focus', () => {
      if (leaveTime && Date.now() - leaveTime >= 4000) sendAction({ title: "action: Visitor Returned", description: `Away for **${Math.round((Date.now() - leaveTime) / 1000)}s**`, color: 0x9d4edd });
      document.title = isSpotify && currSong ? `♫ ${currSong} :3` : "hi :3";
    });

    /* Clock & Pill */
    const greetings = ["boykisser mode", "thigh high socks", "headpat receiver", "cozy blanket fort", "midnight cuddles", "cute tail wiggles", "extreme silliness"];
    let gIdx = 0;
    setInterval(() => {
      try {
        const timeStr = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit', hour12: true }).format(new Date());
        if (el('live-greeting')) el('live-greeting').innerText = `${greetings[gIdx]} // ${timeStr} CT`;
      } catch (_) {}
    }, 1000);
    setInterval(() => gIdx = (gIdx + 1) % greetings.length, 6000);

    /* Whisper Modal */
    function toggleDmBox() {
      playTone([820, 140]);
      const modal = el('dm-modal'), btn = el('dm-toggle-btn');
      if (modal) {
        const hide = modal.style.display === 'none';
        modal.style.display = hide ? 'flex' : 'none';
        if (btn) btn.style.display = hide ? 'none' : 'flex';
      }
    }

    async function sendWhisper() {
      const input = el('dm-input');
      if (!input || !input.value.trim()) { showToast("[ type something first! >_< ]"); return; }
      const msg = input.value.trim();
      playTone([820, 140]);
      showToast("[ sending whisper... ]");

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "whisper", message: msg, os: navigator.platform || "Unknown" })
        });
        if (res.ok) {
          showToast("[ sent successfully! ♡ ]");
          input.value = "";
          toggleDmBox();
        } else { showToast("[ error sending >_< ]"); }
      } catch (_) { showToast("[ connection error ]"); }
    }

    /* Audio */
    let audioCtx;
    function playTone(freqs) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.07);
          gain.gain.setValueAtTime(0.07, audioCtx.currentTime + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.07 + 0.08);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + i * 0.07);
          osc.stop(audioCtx.currentTime + i * 0.07 + 0.08);
        });
      } catch (_) {}
    }

    function sendWebhook(url, username, embed) {
      if (resolvedIp && isOwner(resolvedIp)) return;
      try {
        const fd = new FormData();
        fd.append("payload_json", JSON.stringify({ username, avatar_url: "https://api.dicebear.com/7.x/bottts/svg?seed=emolarp", embeds: [embed] }));
        fetch(url, { method: "POST", mode: "no-cors", body: fd }).catch(() => {});
      } catch (_) {}
    }
    const sendTelemetry = (embed) => sendWebhook(TELEMETRY_URL, "emolarp // telemetry", embed);
    const sendAction = (embed) => {
      if (Date.now() - lastAction < 400) return;
      lastAction = Date.now();
      sendWebhook(ACTIONS_URL, "emolarp // actions", embed);
    };

    function showToast(msg) {
      if (el('toast')) { el('toast').innerText = msg; el('toast').classList.add('visible'); setTimeout(() => el('toast').classList.remove('visible'), 1400); }
    }

    function delayedRedirect(url, name) {
      playTone([820, 140]);
      sendAction({ title: "action: Badge Click", description: `Opened **${name.toUpperCase()}**`, color: 0x9d4edd });
      showToast(`[ opening ${name}... ]`);
      setTimeout(() => window.open(url, '_blank', 'noopener,noreferrer'), 350);
    }

    function centerCardAction() {
      playTone([820, 140]);
      Object.assign(el('draggable-card').style, { position: "relative", left: "auto", top: "auto", transform: "none" });
      showToast("[ centered ]");
      if (el('custom-context-menu')) el('custom-context-menu').style.display = "none";
    }

    function copyDiscordAction() {
      playTone([820, 140]);
      navigator.clipboard.writeText(DISCORD_USER_ID).then(() => showToast("[ copied discord id! ]"));
      if (el('custom-context-menu')) el('custom-context-menu').style.display = "none";
    }

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault(); playTone([820, 140]);
      const menu = el('custom-context-menu');
      if (menu) {
        menu.style.display = "block";
        menu.style.left = `${Math.min(e.clientX, window.innerWidth - 160)}px`;
        menu.style.top = `${Math.min(e.clientY, window.innerHeight - 120)}px`;
      }
    });
    window.addEventListener('click', (e) => { if (!e.target.closest('#custom-context-menu') && el('custom-context-menu')) el('custom-context-menu').style.display = "none"; });

    /* Spotify Progress */
    setInterval(() => {
      if (!isSpotify || !spotifyTs?.start || !spotifyTs?.end) return;
      const total = spotifyTs.end - spotifyTs.start, cur = Math.min(Math.max(Date.now() - spotifyTs.start, 0), total);
      if (el('spotify-progress-fill')) el('spotify-progress-fill').style.width = `${(cur / total) * 100}%`;
      if (el('spotify-time-current')) el('spotify-time-current').innerText = `${Math.floor(cur/1000/60)}:${Math.floor((cur/1000)%60).toString().padStart(2,'0')}`;
      if (el('spotify-time-total')) el('spotify-time-total').innerText = `${Math.floor(total/1000/60)}:${Math.floor((total/1000)%60).toString().padStart(2,'0')}`;
    }, 1000);

    /* Avatar Clicks */
    if (el('avatar-container')) {
      el('avatar-container').addEventListener('click', (e) => {
        playTone([820, 140]);
        patCount = (Date.now() - lastPat < 800) ? patCount + 1 : 1;
        lastPat = Date.now();
        if (patCount === 5 && el('secret-popup') && el('popup-bubble')) {
          el('popup-bubble').innerText = "headpat combo x5! (*ฅ́˘ฅ̀*)";
          el('secret-popup').classList.add("show");
          setTimeout(() => el('secret-popup').classList.remove("show"), 3500);
        }
      });
    }

    if (el('activity-tracker')) {
      el('activity-tracker').addEventListener('click', () => {
        playTone([820, 140]);
        navigator.clipboard.writeText(rawStatus || el('activity-tracker').innerText.trim()).then(() => showToast("[ copied status! ]"));
      });
    }

    /* Secret Popup Dialogue */
    const lines = ["nyaa~ meow! :3", "do u like my striped thigh highs? (⁄ ⁄>⁄ ▽ ⁄<⁄ ⁄)", "headpats please?? (˶ᵔ ᵕ ᵔ˶)", "ur my favorite visitor so far :3"];
    if (el('secret-popup')) {
      el('secret-popup').addEventListener('click', () => {
        playTone([820, 140]);
        if (el('popup-bubble')) el('popup-bubble').innerText = lines[Math.floor(Math.random() * lines.length)];
      });
    }

    /* Keystrokes */
    let kBuf = "";
    document.addEventListener('keydown', (e) => {
      if (!e.key || e.key.length !== 1) return;
      kBuf = (kBuf + e.key.toLowerCase()).slice(-10);
      if (kBuf.endsWith("catboy")) { playTone([523, 659, 783, 1046]); document.body.classList.toggle("theme-catboy"); kBuf = ""; }
      else if (kBuf.endsWith("femboy")) { playTone([659, 880, 987, 1318]); document.body.classList.toggle("theme-femboy"); kBuf = ""; }
    }, true);

    function applyAudioState() {
      if (!siteEntered) return;
      const v = el('bg-video'), sIcon = el('sound-icon'), aVis = el('audio-vis');
      if (userMuted) {
        if (v) { v.muted = true; v.volume = 0; }
        if (sIcon) sIcon.className = "fa-solid fa-volume-xmark";
        if (aVis) aVis.classList.remove('playing');
        return;
      }
      if (isSpotify) {
        if (v) { v.muted = true; v.volume = 0; }
        if (sIcon) sIcon.className = "fa-brands fa-spotify";
        if (aVis) aVis.classList.add('playing');
      } else {
        if (v) { v.muted = false; v.volume = 1; v.play().catch(() => {}); }
        if (sIcon) sIcon.className = "fa-solid fa-volume-high";
        if (aVis) aVis.classList.add('playing');
      }
    }
    const toggleMasterAudio = () => { playTone([820, 140]); userMuted = !userMuted; applyAudioState(); };

    /* Typewriter */
    const phrases = ["i love you so much it hurts... (⁄ ⁄>⁄ ▽ ⁄<⁄ ⁄)", "don't look away from me <3 (¬_¬ )", "staring right through your screen (*ฅ́˘ฅ̀*)"];
    let currP = "", cIdx = 0, isDel = false;
    function typeLoop() {
      if (!currP) currP = phrases[Math.floor(Math.random() * phrases.length)];
      if (!isDel) {
        if (el('typewriter-text')) el('typewriter-text').textContent = currP.substring(0, ++cIdx);
        if (cIdx === currP.length) { isDel = true; setTimeout(typeLoop, 2000); return; }
      } else {
        if (el('typewriter-text')) el('typewriter-text').textContent = currP.substring(0, --cIdx);
        if (cIdx === 0) { isDel = false; currP = ""; }
      }
      setTimeout(typeLoop, isDel ? 30 : 65);
    }
    typeLoop();

    /* Lanyard */
    function handlePresence(data) {
      if (!data) return;
      const tracker = el('activity-tracker'), dot = el('status-dot'), avatarImg = el('avatar-img'), spotifyCard = el('spotify-player');
      if (data.discord_user?.avatar && avatarImg) avatarImg.src = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${data.discord_user.avatar}.png?size=256`;

      if (data.listening_to_spotify && data.spotify) {
        currSong = data.spotify.song;
        if (el('spotify-song')) el('spotify-song').textContent = currSong;
        if (el('spotify-artist')) el('spotify-artist').textContent = data.spotify.artist;
        if (data.spotify.album_art_url && el('spotify-art')) el('spotify-art').src = data.spotify.album_art_url;
        spotifyTs = data.spotify.timestamps;
        if (spotifyCard) spotifyCard.style.display = 'flex';
        if (!isSpotify) { isSpotify = true; applyAudioState(); }
      } else {
        currSong = ""; spotifyTs = null;
        if (spotifyCard) spotifyCard.style.display = 'none';
        if (isSpotify) { isSpotify = false; applyAudioState(); }
      }

      const status = data.activities?.find(a => a.type === 4), game = data.activities?.find(a => a.type === 0);
      rawStatus = game ? `Playing ${game.name}` : (status?.state ? `${status.emoji?.name || ""} ${status.state}` : data.discord_status || "online");

      if (game) { dot.className = "status-ingame"; tracker.innerText = rawStatus; }
      else if (status?.state) { dot.className = `status-${data.discord_status || "online"}`; tracker.innerText = rawStatus; }
      else { dot.className = `status-${data.discord_status || "offline"}`; tracker.innerText = data.discord_status || "offline"; }
    }

    async function initLanyard() {
      try { const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`); const json = await res.json(); if (json.success) handlePresence(json.data); } catch (_) {}
    }
    initLanyard();

    function connectWs() {
      try {
        const ws = new WebSocket("wss://api.lanyard.rest/socket");
        ws.onopen = () => ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
        ws.onmessage = (e) => { const d = JSON.parse(e.data); if (d.t === "INIT_STATE" || d.t === "PRESENCE_UPDATE") handlePresence(d.d); };
        ws.onclose = () => setTimeout(connectWs, 3000);
      } catch (_) {}
    }
    connectWs();

    /* Dragging */
    let isDrag = false, startX = 0, startY = 0, initL = 0, initT = 0;
    const card = el('draggable-card');
    card.addEventListener("pointerdown", (e) => {
      if (e.target.closest("a, button, .spotify-card, #activity-tracker, .typewriter-box, #avatar-container, #dm-modal, textarea")) return;
      isDrag = true; card.classList.add("dragging"); card.setPointerCapture(e.pointerId);
      const rect = card.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY; initL = rect.left; initT = rect.top;
      Object.assign(card.style, { position: "fixed", left: `${initL}px`, top: `${initT}px`, margin: "0", transform: "none" });
    });
    card.addEventListener("pointermove", (e) => { if (isDrag) { card.style.left = `${initL + (e.clientX - startX)}px`; card.style.top = `${initT + (e.clientY - startY)}px`; } });
    const stopDrag = (e) => { if (isDrag) { isDrag = false; card.classList.remove("dragging"); try { card.releasePointerCapture(e.pointerId); } catch (_) {} } };
    card.addEventListener("pointerup", stopDrag); card.addEventListener("pointercancel", stopDrag);

    /* Telemetry */
    async function recordVisit() {
      try {
        const res = await fetch("https://ipwho.is/");
        if (!res.ok) return;
        const net = await res.json();
        const ip = (net.ip || "").toLowerCase().trim();
        resolvedIp = ip;
        if (isOwner(ip)) return;

        sendTelemetry({
          title: "Inbound Session",
          description: `\`${ip}\` — ${[net.city, net.region_code, net.country].filter(Boolean).join(", ")}`,
          color: 0x7b2cbf,
          fields: [
            { name: "network routing", value: `**Provider:** \`${net.connection?.org || net.connection?.isp || "Unknown"}\``, inline: false },
            { name: "client spec", value: `**OS:** \`${navigator.platform || "Unknown"}\`\n**Res:** \`${screen.width}x${screen.height}\``, inline: true }
          ],
          footer: { text: "emolarp.fans // visitor access" },
          timestamp: new Date().toISOString()
        });
      } catch (_) {}
    }
    recordVisit();
  </script>
</body>
</html>
